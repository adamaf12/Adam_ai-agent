name: Android APK Release

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build web app
        run: npm run build
        env:
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY }}
      - name: Add Android platform if missing
        run: |
          if [ ! -d android ]; then npx cap add android; fi
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew
      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
      - name: Verify APK signature and prepare download
        run: |
          set -euo pipefail
          APK="$(find android/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          if [ -z "$APK" ]; then
            echo "No release APK was produced."
            find android/app/build/outputs -type f -name '*.apk' -print || true
            exit 1
          fi
          APKSIGNER="$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner -perm -u+x -print -quit 2>/dev/null || true)"
          if [ -z "$APKSIGNER" ]; then
            echo "No executable apksigner found under ${ANDROID_HOME}/build-tools"
            exit 1
          fi
          "$APKSIGNER" verify --verbose "$APK"
          mkdir -p release
          VERSION="${GITHUB_REF_NAME:-${GITHUB_SHA::7}}"
          VERSION="${VERSION//\//-}"
          cp "$APK" "release/Adam-AI-Agent-${VERSION}.apk"
          ls -lh release/*.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Adam-AI-Agent-release-apk
          path: release/*.apk
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*.apk
