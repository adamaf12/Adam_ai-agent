name: Android APK Release

on:
  workflow_dispatch:
  push:
    branches: [main, 'rebuild/adam-ai-v2']
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: |
          sdkmanager --licenses </dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build web app
        run: npm run build
        env:
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY }}

      - name: Add Android platform if missing
        run: |
          if [ ! -d android ]; then npx cap add android; fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Configure installable release signing
        working-directory: android
        run: |
          set -euo pipefail
          mkdir -p app/build/keys
          keytool -genkeypair -v \
            -keystore app/build/keys/adam-release.jks \
            -storepass adam-release-password \
            -keypass adam-release-password \
            -alias adam-release \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Adam AI Agent, OU=Adam, O=Adam AI Agent, L=Blida, ST=Blida, C=DZ"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/build.gradle')
          s = p.read_text()
          if 'signingConfigs {' not in s:
              marker = 'android {\n'
              block = '''android {\n    signingConfigs {\n        release {\n            storeFile file("build/keys/adam-release.jks")\n            storePassword "adam-release-password"\n            keyAlias "adam-release"\n            keyPassword "adam-release-password"\n        }\n    }\n'''
              s = s.replace(marker, block, 1)
          if 'signingConfig signingConfigs.release' not in s:
              build_types = s.find('buildTypes {')
              if build_types < 0:
                  raise SystemExit('buildTypes block not found')
              release = s.find('release {', build_types)
              if release < 0:
                  raise SystemExit('release build type not found')
              insert_at = release + len('release {')
              s = s[:insert_at] + '\n            signingConfig signingConfigs.release' + s[insert_at:]
          p.write_text(s)
          PY

      - name: Build signed release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify APK signature and prepare download
        run: |
          set -euo pipefail
          APK="$(find android/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          if [ -z "$APK" ]; then
            echo "No release APK was produced."
            find android/app/build/outputs -type f -name '*.apk' -print || true
            exit 1
          fi
          APKSIGNER="$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner -perm -u+x -print -quit 2>/dev/null || true)"
          if [ -z "$APKSIGNER" ]; then
            echo "No executable apksigner found under ${ANDROID_HOME}/build-tools"
            find "${ANDROID_HOME}/build-tools" -name apksigner -type f -print || true
            exit 1
          fi
          echo "Using apksigner: $APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"
          mkdir -p release
          VERSION="${GITHUB_REF_NAME:-${GITHUB_SHA::7}}"
          VERSION="${VERSION//\//-}"
          cp "$APK" "release/Adam-AI-Agent-${VERSION}.apk"
          ls -lh release/*.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Adam-AI-Agent-release-apk
          path: release/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*.apk
