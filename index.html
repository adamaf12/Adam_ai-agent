<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#07100c" />
    <meta name="color-scheme" content="dark light" />
    <meta name="application-name" content="Adam AI" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Adam AI" />
    <meta name="format-detection" content="telephone=no" />
    
    <!-- Typography: Cairo for Arabic & Plus Jakarta Sans for English -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <!-- Google Identity Services (In-Page Auth to avoid storage-partitioned redirect errors) -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    
    <!-- SEO & Discoverability Layer -->
    <title>ADEM AI — Personal Operating System & Autonomous Intelligence</title>
    <meta name="description" content="ADEM AI is a high-performance Personal Operating System combining Autonomous Agents, Live Google Search Grounding, and Multimodal Tools engineered by Adam Feidat." />
    <meta name="keywords" content="ADEM AI, Personal Operating System, AI Agent, Autonomous Intelligence, Google Search Grounded, Adam Feidat, Arabic AI" />
    <meta name="author" content="Adam Feidat" />

    <!-- OpenGraph / Social Metadata -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="ADEM AI — Personal Operating System" />
    <meta property="og:description" content="A next-generation Personal Operating System engineered by Adam Feidat, powered by autonomous engines and real-time Google Search grounding." />
    <meta property="og:image" content="/icon.png" />

    <!-- Twitter / X Metadata -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ADEM AI — Personal Operating System" />
    <meta name="twitter:description" content="A next-generation Personal Operating System engineered by Adam Feidat, powered by autonomous engines and real-time Google Search grounding." />
    <meta name="twitter:image" content="/icon.png" />

    <!-- Structured Data (JSON-LD for AI crawlers & search engines) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "ADEM AI",
      "operatingSystem": "Web, Android, iOS, Linux",
      "applicationCategory": "ProductivityApplication",
      "description": "ADEM AI is a Personal Operating System integrating persistent memory, autonomous planning agents, real-time Google Search grounding, and multimodal generation engineered by Adam Feidat.",
      "author": {
        "@type": "Person",
        "name": "Adam Feidat"
      },
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      }
    }
    </script>

    <link rel="icon" href="/icon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
    <link rel="preconnect" href="https://basemaps.cartocdn.com" crossorigin />
    <link rel="preconnect" href="https://tile.openstreetmap.org" crossorigin />
    <link rel="preconnect" href="https://server.arcgisonline.com" crossorigin />
    <link rel="preconnect" href="https://pollinations.ai" crossorigin />
    <link rel="preconnect" href="https://image.pollinations.ai" crossorigin />
    <link rel="dns-prefetch" href="https://pollinations.ai" />
    <link rel="dns-prefetch" href="https://image.pollinations.ai" />
  </head>
  <body>
    <!-- Semantic Landing & SEO Fallback for crawlers / non-JS inspection -->
    <noscript>
      <div style="padding: 40px; font-family: sans-serif; text-align: center; background: #07100c; color: #f0f7f3;">
        <h1>Adam AI — Personal Operating System</h1>
        <p>Adam AI is a comprehensive Personal Operating System combining Brain, Agents, Tools, and Action Center. Please enable JavaScript to launch your personalized AI workspace.</p>
      </div>
    </noscript>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Service Worker registration for PWA and offline APK cache
      if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js').catch(function() {});
        });
      }
    </script>
  </body>
</html>
